<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Motchill Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  <link rel="stylesheet" href="styles/input.css" />
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased">

  <!-- Top Mobile Header -->
  <header class="sticky top-0 z-30 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-900 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-red-600"></span>
      <span class="font-black tracking-tight text-base text-white">MOTCHILL<span class="text-red-500">.APP</span></span>
    </div>
    <button onclick="window.appRouter.go('explore')" class="text-zinc-300 text-sm px-2.5 py-1 rounded-lg bg-zinc-900 border border-zinc-800">
      🔍 Tìm phim
    </button>
  </header>

  <!-- Main Portrait Screen Content -->
  <main id="main-view" class="min-h-screen pb-20"></main>

  <!-- Fullscreen Detail & Sticky Player Modal -->
  <div id="detail-modal" class="hidden fixed inset-0 z-50 bg-zinc-950 overflow-hidden"></div>

  <!-- Fixed Bottom Tab Bar (Thumb-friendly Portrait Navigation) -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-zinc-950/95 backdrop-blur-md border-t border-zinc-900 pb-[env(safe-area-inset-bottom)]">
    <div class="grid grid-cols-3 h-16">
      <button data-tab="home" onclick="window.appRouter.go('home')" class="flex flex-col items-center justify-center gap-1 text-red-500 active:scale-95">
        <span class="text-lg">🏠</span>
        <span class="text-[11px] font-semibold">Trang chủ</span>
      </button>
      <button data-tab="explore" onclick="window.appRouter.go('explore')" class="flex flex-col items-center justify-center gap-1 text-zinc-400 active:scale-95">
        <span class="text-lg">🧭</span>
        <span class="text-[11px] font-semibold">Khám phá</span>
      </button>
      <button data-tab="library" onclick="window.appRouter.go('library')" class="flex flex-col items-center justify-center gap-1 text-zinc-400 active:scale-95">
        <span class="text-lg">📚</span>
        <span class="text-[11px] font-semibold">Tủ phim</span>
      </button>
    </div>
  </nav>

  <!-- Modular Scripts -->
  <script src="js/api/api-service.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/components/movie-card.js"></script>
  <script src="js/pages/app-controller.js"></script>
</body>
</html>
