<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141414" />
  <title>Rosi Cinema</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  <link rel="stylesheet" href="styles/input.css" />
</head>
<body class="bg-[#141414] text-white font-sans antialiased selection:bg-[#e50914]/35">

  <header id="mobile-header" class="sticky top-0 z-30 nf-glass border-b border-neutral-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="font-black tracking-wider text-lg text-[#e50914]">ROSI<span class="text-white"> CINEMA</span></span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="window.appRouter.go('topweek')"
              class="text-neutral-200 text-xs font-bold px-3 py-1.5 rounded bg-[#222222] border border-neutral-700 transition">
        Top Tuần
      </button>
      <button onclick="window.appRouter.go('explore')"
              class="text-neutral-200 text-xs font-semibold px-3 py-1.5 rounded bg-[#222222] border border-neutral-700 transition">
        Tìm kiếm
      </button>
    </div>
  </header>

  <main id="main-view" class="min-h-screen pb-20"></main>

  <div id="detail-modal" class="hidden fixed inset-0 z-50 bg-[#141414] overflow-hidden"></div>

  <nav id="mobile-bottom-nav" class="fixed bottom-0 inset-x-0 z-40 nf-glass border-t border-neutral-800 pb-[env(safe-area-inset-bottom)]">
    <div class="grid grid-cols-4 h-16 px-1">
      <button data-tab="home" onclick="window.appRouter.go('home')"
              class="flex flex-col items-center justify-center gap-1 text-white transition">
        <span class="text-[11px] font-black tracking-wide">Trang chủ</span>
        <span class="nav-indicator w-6 h-0.5 rounded bg-[#e50914] transition"></span>
      </button>
      <button data-tab="topweek" onclick="window.appRouter.go('topweek')"
              class="flex flex-col items-center justify-center gap-1 text-neutral-400 transition">
        <span class="text-[11px] font-bold tracking-wide">Top Tuần</span>
        <span class="nav-indicator w-6 h-0.5 rounded bg-transparent transition"></span>
      </button>
      <button data-tab="explore" onclick="window.appRouter.go('explore')"
              class="flex flex-col items-center justify-center gap-1 text-neutral-400 transition">
        <span class="text-[11px] font-bold tracking-wide">Đề xuất</span>
        <span class="nav-indicator w-6 h-0.5 rounded bg-transparent transition"></span>
      </button>
      <button data-tab="library" onclick="window.appRouter.go('library')"
              class="flex flex-col items-center justify-center gap-1 text-neutral-400 transition">
        <span class="text-[11px] font-bold tracking-wide">Tủ phim</span>
        <span class="nav-indicator w-6 h-0.5 rounded bg-transparent transition"></span>
      </button>
    </div>
  </nav>

  <script src="js/api/api-service.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/components/movie-card.js"></script>
  <script src="js/pages/app-controller.js"></script>
</body>
</html>
