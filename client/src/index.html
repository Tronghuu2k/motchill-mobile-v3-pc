<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Rosi Cinema</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  <link rel="stylesheet" href="styles/input.css" />
</head>
<body class="bg-[#0b0b0f] text-zinc-100 font-sans antialiased selection:bg-[#E50914]/30">

  <header class="sticky top-0 z-30 glass-bar border-b border-white/10 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="bg-[#E50914] text-white font-black text-sm px-2 py-0.5 rounded shadow">R</span>
      <span class="font-black tracking-wider text-base text-white">ROSI<span class="text-[#E50914]"> CINEMA</span></span>
    </div>
    <div class="flex items-center gap-2">
      <button tabindex="0" onclick="window.appRouter.go('daily')"
              class="tv-focusable text-emerald-400 text-[11px] font-bold px-2.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/25 active:scale-95 transition">
        🆕 Hôm nay
      </button>
      <button tabindex="0" onclick="window.appRouter.go('explore')"
              class="tv-focusable text-zinc-200 text-xs font-semibold px-3 py-1.5 rounded-full bg-zinc-900 border border-white/10 active:scale-95 transition">
        🔍 Tìm
      </button>
    </div>
  </header>

  <main id="main-view" class="min-h-screen pb-20"></main>

  <div id="detail-modal" class="hidden fixed inset-0 z-50 bg-[#0b0b0f] overflow-hidden"></div>

  <nav class="fixed bottom-0 inset-x-0 z-40 glass-bar border-t border-white/10 pb-[env(safe-area-inset-bottom)]">
    <div class="grid grid-cols-4 h-16 px-1">
      <button tabindex="0" data-tab="home" onclick="window.appRouter.go('home')"
              class="tv-focusable flex flex-col items-center justify-center gap-0.5 text-[#E50914] active:scale-95 transition">
        <span class="nav-pill px-3.5 py-1 rounded-full bg-[#E50914]/20 transition text-base leading-none">🏠</span>
        <span class="text-[10px] font-bold tracking-wide">Trang chủ</span>
      </button>
      <button tabindex="0" data-tab="daily" onclick="window.appRouter.go('daily')"
              class="tv-focusable relative flex flex-col items-center justify-center gap-0.5 text-zinc-400 active:scale-95 transition">
        <span id="daily-nav-badge" class="hidden absolute top-1.5 right-3 bg-emerald-500 text-zinc-950 text-[9px] font-black px-1.5 rounded-full">0</span>
        <span class="nav-pill px-3.5 py-1 rounded-full transition text-base leading-none">🆕</span>
        <span class="text-[10px] font-bold tracking-wide">Hôm nay</span>
      </button>
      <button tabindex="0" data-tab="explore" onclick="window.appRouter.go('explore')"
              class="tv-focusable flex flex-col items-center justify-center gap-0.5 text-zinc-400 active:scale-95 transition">
        <span class="nav-pill px-3.5 py-1 rounded-full transition text-base leading-none">🧭</span>
        <span class="text-[10px] font-bold tracking-wide">Khám phá</span>
      </button>
      <button tabindex="0" data-tab="library" onclick="window.appRouter.go('library')"
              class="tv-focusable flex flex-col items-center justify-center gap-0.5 text-zinc-400 active:scale-95 transition">
        <span class="nav-pill px-3.5 py-1 rounded-full transition text-base leading-none">📚</span>
        <span class="text-[10px] font-bold tracking-wide">Danh sách</span>
      </button>
    </div>
  </nav>

  <script src="js/api/api-service.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/components/movie-card.js"></script>
  <script src="js/pages/app-controller.js"></script>
</body>
</html>
